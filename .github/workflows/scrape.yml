name: Job Radar

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GH may delay 5-15min at peak)
  workflow_dispatch:          # manual trigger from Actions tab

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit storage.db back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL:          INFO
        run: python main.py

      - name: Commit dedup state
        run: |
          if [[ -n "$(git status --porcelain storage.db)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add storage.db
            git commit -m "chore: update dedup state [skip ci]"
            git push
          else
            echo "No new jobs sent — storage.db unchanged."
          fi
