# ----------------------------------------------------------------------------
# IT Trend Radar — tracks hot products/launches in the IT/dev space from:
#   Product Hunt · Hacker News (front page + Show HN) · GitHub Trending ·
#   Exploding Topics (best-effort via public RSS).
# Alerts fire to a SEPARATE Telegram chat (TELEGRAM_TRENDS_CHAT_ID in .env).
# ----------------------------------------------------------------------------

# Items older than this (hours) are dropped. GitHub Trending items have no
# timestamp and are let through.
max_age_hours: 48

# Hard gate: require at least one `it_keywords` match on title/description/tags.
require_it_match: true

# Soft cap on raw items fetched per source (before filtering).
max_items_per_source: 40

sources:
  producthunt: true
  hackernews: true
  github_trending: true
  exploding_topics: true     # best-effort; silently skips if feed is down

# GitHub Trending languages to pull. Empty string "" = all languages.
# Keep this short — each entry is one extra HTTP request.
github_languages:
  - ""            # all languages (overall trending)
  - typescript
  - python
  - rust
  - go

# ----------------------------------------------------------------------------
# IT / dev keywords. Case-insensitive. Short tokens (<=4 chars) use
# word-boundary matching to avoid false positives (e.g. "ai" won't match
# "chair"); longer tokens use substring match.
# ----------------------------------------------------------------------------
